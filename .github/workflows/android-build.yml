name: Android APK Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Tells all steps to run inside your specific Android folder
    defaults:
      run:
        working-directory: resources/android-project

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Compatible Gradle Version
        uses: gradle/actions/setup-gradle@v3
        with:
          # Forces the runner to use Gradle 7.6.3 to prevent jcenter() 
          # and configuration-time crashes with the older Android plugin.
          gradle-version: '7.6.3' 

      - name: Remove Incompatible Modern SDKs
        # Deletes API 34, 35, and 36 from the CI runner so the older 
        # Gradle plugin scanner doesn't crash on the new XML schemas.
        run: |
          rm -rf $ANDROID_HOME/platforms/android-34*
          rm -rf $ANDROID_HOME/platforms/android-35*
          rm -rf $ANDROID_HOME/platforms/android-36*
          rm -rf $ANDROID_HOME/build-tools/34.*
          rm -rf $ANDROID_HOME/build-tools/35.*
          rm -rf $ANDROID_HOME/build-tools/36.*

      - name: Generate Missing Gradle Wrapper
        # Dynamically creates gradlew and gradle-wrapper.jar on the CI server
        run: gradle wrapper

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: craftos-pc-debug-apk
          path: resources/android-project/app/build/outputs/apk/debug/*.apk
          retention-days: 14
