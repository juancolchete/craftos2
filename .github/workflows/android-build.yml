name: Android APK Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: resources/android-project

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Compatible Gradle Version
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.3' 

      - name: Remove Incompatible Modern SDKs
        run: |
          rm -rf $ANDROID_HOME/platforms/android-3[4-9]*
          rm -rf $ANDROID_HOME/build-tools/3[4-9].*

      - name: Generate Missing Gradle Wrapper
        run: gradle wrapper

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: craftos-pc-debug-apk
          path: resources/android-project/app/build/outputs/apk/debug/*.apk
          retention-days: 14
